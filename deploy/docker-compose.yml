# Docker Compose stack: Python translation API + Go gateway.
# Run from this directory (deploy/):  docker compose up -d
# Server deploy (pull + recreate):    deploy/docker-deploy.sh
# Build & push images (dev machine):  deploy/docker-push.sh
#
# Both containers use host networking: the gateway listens on host :8080
# (the host reverse proxy terminates TLS in front of it, unchanged), and the
# API binds 127.0.0.1:11008 so only the gateway can reach it — the same
# network topology as the previous bare-process deploy.

name: pdfmath

services:
  pdf2zh:
    platform: linux/amd64   # the server is amd64; pinned so local (arm) builds match
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        CACHEBUST: ${CACHEBUST:-1}
    image: luckymrwang/pdf2zh:latest
    restart: unless-stopped
    network_mode: host
    environment:
      # Host network: bind loopback only — the gateway reaches it via
      # 127.0.0.1, nothing else can (mirrors the old start-api.sh bind).
      PDF2ZH_API_HOST: "127.0.0.1"
      PDF2ZH_API_PORT: "11008"
      # Tuning for an 8-core / 8G box, mirrors deploy/start-api.sh.
      PDF2ZH_MAX_CONCURRENT: "2"
      PDF2ZH_QPS: "4"
      PDF2ZH_POOL_MAX_WORKERS: "4"
      PDF2ZH_NO_MONO: "true"
      PDF2ZH_MAX_PAGES_PER_PART: "50"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:11008/health',timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  gateway:
    platform: linux/amd64   # the server is amd64; pinned so local (arm) builds match
    build:
      context: ../examples/go-gateway
    image: luckymrwang/go-gateway:latest
    restart: unless-stopped
    network_mode: host   # listens on host :8080 directly; no ports mapping
    env_file:
      - ../examples/go-gateway/.env   # secrets; gitignored, lives on the server
    environment:   # compose precedence: these override env_file
      PDF2ZH_API_URL: http://127.0.0.1:11008
      VIRTUALPAY_DATA_DIR: /data
      # Keep in sync with the gateway Dockerfile HEALTHCHECK port.
      GATEWAY_ADDR: ":8080"
    volumes:
      # Bind mount of the pre-existing order store (root-owned on the host);
      # existing orders survive the migration from the bare-process deploy.
      - ../examples/go-gateway/data/virtualpay:/data
    user: "0:0"   # the host-side data dir is root-owned
    depends_on:
      pdf2zh:
        condition: service_healthy
