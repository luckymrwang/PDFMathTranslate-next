apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf2zh-web
  namespace: ping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf2zh-web
  template:
    metadata:
      labels:
        app: pdf2zh-web
    spec:
      containers:
        - name: pdf2zh-web
          image: 2026669.xyz:65000/luckymrwang/pdf2zh-web:lan-20261110-2
          imagePullPolicy: IfNotPresent
          env:
            - name: LAN_DATA_DIR
              value: /data
          volumeMounts:
            - name: model-config
              mountPath: /data
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: model-config
          persistentVolumeClaim:
            claimName: pdf2zh-web-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pdf2zh-web-config
  namespace: ping
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath-incloud
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pdf2zh-web
  namespace: ping
spec:
  type: NodePort
  selector:
    app: pdf2zh-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
